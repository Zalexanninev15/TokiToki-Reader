name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Seconds, and it catches the scripted-edit damage that would otherwise burn a
      # full Android build to discover.
      - name: Source checks
        run: python3 tools/check_sources.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/TokiToki-Reader-${{ github.ref_name }}-${{ github.run_number }}.apk"

      # The APK is the only artifact. Test reports and lint output stay in the job log.
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: apk
    # Was pinned to main only, which silently skipped the job on a master-named
    # default branch. Skipped jobs look like nothing happened, hence the missing release.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4-alpha-${{ github.run_number }}
          name: 0.4 alpha (build ${{ github.run_number }})
          prerelease: true
          files: out/*.apk
          body: |
            Автоматическая сборка из `main`, коммит ${{ github.sha }}.

            Alpha-сборка: Telegram не поддерживается, публикация и реакции не реализованы.
