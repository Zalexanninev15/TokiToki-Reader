name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: JVM modules (domain + data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The repository intentionally ships without gradle/wrapper/gradle-wrapper.jar:
      # committing an opaque binary that CI then executes is exactly the supply-chain
      # shape worth avoiding. Gradle is installed by the action and generates the wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.10.2

      # `build` already runs `test`; the separate step existed only to make the log
      # easier to read and doubled the work. One invocation, one source of truth.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

